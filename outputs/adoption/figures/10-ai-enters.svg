<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 960" width="560" height="960" role="img" aria-labelledby="10-ai-enters-title 10-ai-enters-desc">
<title id="10-ai-enters-title">Buying a shop and building one are different</title>
<desc id="10-ai-enters-desc">A separate controlled experiment holds household budgets and prices fixed. An acquisition transfers existing equity and adds no GDP. New equipment is production. The new business then shares the same consumer spending.</desc>
<style>text{font-family:DejaVu Sans,Arial,sans-serif}.travel-token{opacity:0}</style>
<rect width="560" height="960" fill="#fffdf8"/>
<text x="24" y="47" font-size="30" fill="#223c36" text-anchor="start">What does the AI company buy?</text>
<text x="24" y="91" font-size="26" fill="#58675f" text-anchor="start">Same customers. Same budgets.</text>
<g class="teaching-stage" data-step="1">
<rect x="24" y="128" width="512" height="212" rx="12" fill="#edf1ea"/>
<text x="44" y="172" font-size="29" fill="#a66d13" text-anchor="start">Buy the existing shop</text>
<text x="44" y="217" font-size="26" fill="#223c36" text-anchor="start">AI company</text>
<line x1="218" y1="208" x2="313" y2="208" stroke="#a66d13" stroke-width="3"/>
<line x1="303.92130823599354" y1="214.2110672073454" x2="313" y2="208" stroke="#a66d13" stroke-width="3"/>
<line x1="303.92130823599354" y1="201.7889327926546" x2="313" y2="208" stroke="#a66d13" stroke-width="3"/>
<circle class="travel-token" data-step="1" data-from="218,208" data-to="313,208" r="8" fill="#a66d13"/>
<text x="331" y="217" font-size="26" fill="#223c36" text-anchor="start">Old owner</text>
<text x="44" y="265" font-size="27" fill="#223c36" text-anchor="start">Purchase price: 20 coins</text>
<text x="44" y="310" font-size="29" fill="#a66d13" text-anchor="start">GDP stays 100</text>
</g>
<g class="teaching-stage" data-step="2">
<rect x="24" y="365" width="512" height="212" rx="12" fill="#edf1ea"/>
<text x="44" y="409" font-size="29" fill="#376d9a" text-anchor="start">Buy newly made equipment</text>
<text x="44" y="454" font-size="26" fill="#223c36" text-anchor="start">AI company</text>
<line x1="218" y1="445" x2="274" y2="445" stroke="#376d9a" stroke-width="3"/>
<line x1="264.92130823599354" y1="451.21106720734537" x2="274" y2="445" stroke="#376d9a" stroke-width="3"/>
<line x1="264.92130823599354" y1="438.78893279265463" x2="274" y2="445" stroke="#376d9a" stroke-width="3"/>
<circle class="travel-token" data-step="2" data-from="218,445" data-to="274,445" r="8" fill="#376d9a"/>
<text x="291" y="454" font-size="26" fill="#223c36" text-anchor="start">Equip. maker</text>
<text x="44" y="502" font-size="27" fill="#223c36" text-anchor="start">New investment: 20 coins</text>
<text x="44" y="547" font-size="28" fill="#376d9a" text-anchor="start">GDP rises to 120 this round</text>
</g>
<g class="teaching-stage" data-step="3">
<text x="24" y="636" font-size="28" fill="#223c36" text-anchor="start">Next round: the new shop opens</text>
<text x="24" y="683" font-size="28" fill="#236654" text-anchor="start">Households still buy 80 baskets</text>
<text x="24" y="727" font-size="26" fill="#223c36" text-anchor="start">The three sellers share those orders.</text>
<line x1="24" y1="764" x2="536" y2="764" stroke="#edf1ea" stroke-width="3"/>
<text x="24" y="809" font-size="28" fill="#223c36" text-anchor="start">GDP = baskets 80</text>
<text x="24" y="851" font-size="28" fill="#223c36" text-anchor="start">+ replacement 22 = 102</text>
<text x="24" y="905" font-size="26" fill="#58675f" text-anchor="start">More replacement equipment.</text>
<text x="24" y="945" font-size="26" fill="#58675f" text-anchor="start">No extra baskets.</text>
</g>
</svg>
