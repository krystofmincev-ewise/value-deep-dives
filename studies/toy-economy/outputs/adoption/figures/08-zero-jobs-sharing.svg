<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 824" width="560" height="824" role="img" aria-labelledby="08-zero-jobs-sharing-title 08-zero-jobs-sharing-desc">
<title id="08-zero-jobs-sharing-title">Zero jobs, two different endings</title>
<desc id="08-zero-jobs-sharing-desc">Two matched cases use full automation, layoffs, expansion and ample AI capacity. One grants worker households 60% of dividends from period 25. The bars split final baskets between worker and owner households, on the same scale. Equipment investment is additional to these baskets. Values are last recorded periods.</desc>
<style>text{font-family:DejaVu Sans,Arial,sans-serif}.travel-token{opacity:0}</style>
<rect width="560" height="824" fill="#fffdf8"/>
<text x="24" y="45" font-size="32" fill="#223c36" text-anchor="start">Zero jobs.</text>
<text x="24" y="88" font-size="32" fill="#223c36" text-anchor="start">Two different endings.</text>
<g class="teaching-stage" data-step="1">
<text x="24" y="192" font-size="27" fill="#223c36" text-anchor="start">No shared dividends</text>
<text x="24" y="236" font-size="27" fill="#58675f" text-anchor="start">0 jobs · real GDP 48.6</text>
<rect x="24" y="264" width="512" height="40" rx="0" fill="#edf1ea"/>
<rect x="24" y="264" width="0.0" height="40" rx="0" fill="#236654"/>
<rect x="24.0" y="264" width="132.987012987013" height="40" rx="0" fill="#a66d13"/>
<text x="24" y="349" font-size="28" fill="#236654" text-anchor="start">Workers: 0 baskets</text>
<text x="24" y="390" font-size="28" fill="#a66d13" text-anchor="start">Owners: 28.6 baskets</text>
</g>
<g class="teaching-stage" data-step="2">
<text x="24" y="437" font-size="27" fill="#223c36" text-anchor="start">Share dividends with workers</text>
<text x="24" y="481" font-size="27" fill="#58675f" text-anchor="start">0 jobs · real GDP 129.1</text>
<rect x="24" y="509" width="512" height="40" rx="0" fill="#edf1ea"/>
<rect x="24" y="509" width="384.5984415584416" height="40" rx="0" fill="#236654"/>
<rect x="408.5984415584416" y="509" width="123.41194805194812" height="40" rx="0" fill="#a66d13"/>
<text x="24" y="594" font-size="28" fill="#236654" text-anchor="start">Workers: 82.6 baskets</text>
<text x="24" y="635" font-size="28" fill="#a66d13" text-anchor="start">Owners: 26.5 baskets</text>
</g>
<g class="teaching-stage" data-step="3">
<text x="24" y="142" font-size="26" fill="#58675f" text-anchor="start">All tasks automated</text>
<line x1="24" y1="699" x2="536" y2="699" stroke="#edf1ea" stroke-width="3"/>
<text x="24" y="746" font-size="26" fill="#223c36" text-anchor="start">Workers receive 60% of dividends</text>
<text x="24" y="785" font-size="26" fill="#58675f" text-anchor="start">from period 25, by assumption.</text>
</g>
</svg>
