<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 610" width="560" height="610" role="img" aria-labelledby="01-buffer-title 01-buffer-desc">
<title id="01-buffer-title">Steady output. Shrinking reserves.</title>
<desc id="01-buffer-desc">One protected-pay path completes 80 rounds while each shop loses money. Each has about 3.27 coins left after round 79; extending the run gives wage arrears in round 90.</desc>
<style>text{font-family:DejaVu Sans,Arial,sans-serif}.travel-token{opacity:0}</style>
<rect width="560" height="610" fill="#fffdf8"/>
<g class="teaching-stage" data-step="1">
<rect x="24" y="20" width="512" height="112" rx="12" fill="#edf1ea"/>
<rect x="24" y="20" width="6" height="112" rx="0" fill="#236654"/>
<text x="42" y="55" font-size="26" fill="#236654" text-anchor="start">After 80 recorded rounds</text>
<text x="42" y="103" font-size="42" fill="#236654" text-anchor="start">Still producing</text>
<text x="42" y="166" font-size="25" fill="#223c36" text-anchor="start">The GDP chart looks steady.</text>
</g>
<g class="teaching-stage" data-step="2">
<rect x="24" y="210" width="512" height="112" rx="12" fill="#edf1ea"/>
<rect x="24" y="210" width="6" height="112" rx="0" fill="#a66d13"/>
<text x="42" y="245" font-size="26" fill="#a66d13" text-anchor="start">Cash left in EACH shop</text>
<text x="42" y="293" font-size="42" fill="#a66d13" text-anchor="start">3.27 coins</text>
<text x="42" y="356" font-size="25" fill="#223c36" text-anchor="start">Losing 0.31 coins each round.</text>
</g>
<g class="teaching-stage" data-step="3">
<rect x="24" y="400" width="512" height="112" rx="12" fill="#edf1ea"/>
<rect x="24" y="400" width="6" height="112" rx="0" fill="#a44432"/>
<text x="42" y="435" font-size="26" fill="#a44432" text-anchor="start">Extend the same experiment</text>
<text x="42" y="483" font-size="42" fill="#a44432" text-anchor="start">Payroll fails</text>
<text x="42" y="546" font-size="25" fill="#223c36" text-anchor="start">Round 90: a payment goes unpaid.</text>
</g>
</svg>
