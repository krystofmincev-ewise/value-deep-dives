<text x="42" y="55" font-size="26" fill="#236654" text-anchor="start">Workers receive</text>
<text x="42" y="103" font-size="42" fill="#236654" text-anchor="start">60</text>
<line x1="147" y1="134" x2="147" y2="195" stroke="#236654" stroke-width="3"/>
