<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 685" width="560" height="685" role="img" aria-labelledby="03-spending-title 03-spending-desc">
<title id="03-spending-title">Where the income goes next</title>
<desc id="03-spending-desc">Workers spend 60 on household goods. Owners spend 20 on household goods and finance 20 of equipment. Household consumption 80 plus equipment 20 equals GDP 100.</desc>
<style>text{font-family:DejaVu Sans,Arial,sans-serif}.travel-token{opacity:0}</style>
<rect width="560" height="685" fill="#fffdf8"/>
