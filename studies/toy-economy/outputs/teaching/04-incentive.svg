<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" width="560" height="540" role="img" aria-labelledby="04-incentive-title 04-incentive-desc">
<title id="04-incentive-title">One firm keeps the saving; others share the lost sales</title>
<desc id="04-incentive-desc">Separate equal-share firm example: payroll saving 6 minus own lost sales 1 gives recurring gain 5 before setup cost. Total lost sales 10 are split 1 at adopter and 9 at other firms.</desc>
<style>text{font-family:DejaVu Sans,Arial,sans-serif}.travel-token{opacity:0}</style>
<rect width="560" height="540" fill="#fffdf8"/>
<g class="teaching-stage" data-step="1">
<rect x="24" y="20" width="512" height="112" rx="12" fill="#edf1ea"/>
<rect x="24" y="20" width="6" height="112" rx="0" fill="#236654"/>
<text x="42" y="55" font-size="26" fill="#236654" text-anchor="start">Adopting firm: payroll saved</text>
<text x="42" y="103" font-size="42" fill="#236654" text-anchor="start">+6</text>
</g>
<g class="teaching-stage" data-step="2">
<line x1="150" y1="136" x2="150" y2="190" stroke="#a44432" stroke-width="3"/>
<line x1="143.7889327926546" y1="180.92130823599354" x2="150" y2="190" stroke="#a44432" stroke-width="3"/>
<line x1="156.2110672073454" y1="180.92130823599354" x2="150" y2="190" stroke="#a44432" stroke-width="3"/>
<circle class="travel-token" data-step="2" data-from="150,136" data-to="150,190" r="8" fill="#a44432"/>
<rect x="24" y="206" width="246" height="112" rx="12" fill="#edf1ea"/>
<rect x="24" y="206" width="6" height="112" rx="0" fill="#a44432"/>
<text x="42" y="241" font-size="26" fill="#a44432" text-anchor="start">Its lost sales</text>
<text x="42" y="289" font-size="42" fill="#a44432" text-anchor="start">−1</text>
<rect x="290" y="206" width="246" height="112" rx="12" fill="#edf1ea"/>
<rect x="290" y="206" width="6" height="112" rx="0" fill="#a44432"/>
<text x="308" y="241" font-size="26" fill="#a44432" text-anchor="start">Others lose</text>
<text x="308" y="289" font-size="42" fill="#a44432" text-anchor="start">−9</text>
</g>
<g class="teaching-stage" data-step="3">
<text x="280" y="402" font-size="31" fill="#223c36" text-anchor="middle">Its recurring gain: 6 − 1 = 5</text>
<text x="280" y="464" font-size="31" fill="#a44432" text-anchor="middle">Town sales: 100 → 90</text>
<text x="280" y="511" font-size="25" fill="#58675f" text-anchor="middle">Separate firm-choice example</text>
</g>
</svg>
