<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 650" width="560" height="650" role="img" aria-labelledby="06-ownership-title 06-ownership-desc">
<title id="06-ownership-title">The starting spending pattern can return without wages</title>
<desc id="06-ownership-desc">A separate ownership run: former workers receive 60 of dividends; owners retain 40 and consume half. Purchases are 60 former-worker consumption, 20 owner consumption and 20 equipment.</desc>
