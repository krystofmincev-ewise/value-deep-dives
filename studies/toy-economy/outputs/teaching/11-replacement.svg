<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-labelledby="11-replacement-title 11-replacement-desc">
<title id="11-replacement-title">New equipment has two different jobs</title>
<desc id="11-replacement-desc">Conceptual diagram: replacement restores worn-out capacity; additional equipment can expand capacity under the assumed technology. Icons do not represent measured quantities.</desc>
<style>text{font-family:DejaVu Sans,Arial,sans-serif}.travel-token{opacity:0}</style>
<rect width="560" height="470" fill="#fffdf8"/>
<g class="teaching-stage" data-step="1">
<rect x="24" y="20" width="246" height="112" rx="12" fill="#edf1ea"/>
<rect x="24" y="20" width="6" height="112" rx="0" fill="#376d9a"/>
<text x="42" y="55" font-size="26" fill="#376d9a" text-anchor="start">Worn capacity</text>
<text x="42" y="103" font-size="42" fill="#376d9a" text-anchor="start">Replace it</text>
<line x1="275" y1="75" x2="286" y2="75" stroke="#376d9a" stroke-width="3"/>
<line x1="276.92130823599354" y1="81.2110672073454" x2="286" y2="75" stroke="#376d9a" stroke-width="3"/>
<line x1="276.92130823599354" y1="68.7889327926546" x2="286" y2="75" stroke="#376d9a" stroke-width="3"/>
<circle class="travel-token" data-step="1" data-from="275,75" data-to="286,75" r="8" fill="#376d9a"/>
<rect x="300" y="20" width="236" height="112" rx="12" fill="#edf1ea"/>
<rect x="300" y="20" width="6" height="112" rx="0" fill="#376d9a"/>
<text x="318" y="55" font-size="26" fill="#376d9a" text-anchor="start">Result</text>
<text x="318" y="103" font-size="42" fill="#376d9a" text-anchor="start">Maintain</text>
</g>
<g class="teaching-stage" data-step="2">
<rect x="24" y="205" width="246" height="112" rx="12" fill="#edf1ea"/>
<rect x="24" y="205" width="6" height="112" rx="0" fill="#376d9a"/>
<text x="42" y="240" font-size="26" fill="#376d9a" text-anchor="start">Extra capacity</text>
<text x="42" y="288" font-size="42" fill="#376d9a" text-anchor="start">Add to it</text>
<line x1="275" y1="260" x2="286" y2="260" stroke="#376d9a" stroke-width="3"/>
<line x1="276.92130823599354" y1="266.21106720734537" x2="286" y2="260" stroke="#376d9a" stroke-width="3"/>
<line x1="276.92130823599354" y1="253.7889327926546" x2="286" y2="260" stroke="#376d9a" stroke-width="3"/>
<circle class="travel-token" data-step="2" data-from="275,260" data-to="286,260" r="8" fill="#376d9a"/>
<rect x="300" y="205" width="236" height="112" rx="12" fill="#edf1ea"/>
<rect x="300" y="205" width="6" height="112" rx="0" fill="#223c36"/>
<text x="318" y="240" font-size="26" fill="#223c36" text-anchor="start">Result</text>
<text x="318" y="288" font-size="42" fill="#223c36" text-anchor="start">Expand</text>
<text x="280" y="403" font-size="27" fill="#58675f" text-anchor="middle">A new machine is not always</text>
<text x="280" y="440" font-size="27" fill="#58675f" text-anchor="middle">an extra working machine.</text>
</g>
</svg>
